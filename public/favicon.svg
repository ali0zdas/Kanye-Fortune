<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#09090b"/>
  <!-- Outer glowing diamond -->
  <polygon points="32,6 58,32 32,58 6,32" stroke="url(#goldGradient)" stroke-width="2.5" fill="#141417" />
  
  <!-- Inner geometric eye / prism -->
  <path d="M16 32 C22 22, 42 22, 48 32 C42 42, 22 42, 16 32 Z" stroke="url(#neonGradient)" stroke-width="2" fill="none"/>
  
  <!-- Center Pupil / Monolith star -->
  <circle cx="32" cy="32" r="5" fill="#f43f5e" />
  <circle cx="32" cy="32" r="2" fill="#ffffff" />
  
  <!-- Subtle occult crosshairs -->
  <line x1="32" y1="12" x2="32" y2="20" stroke="#f4f4f5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="52" stroke="#f4f4f5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="20" y2="32" stroke="#f4f4f5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="32" x2="52" y2="32" stroke="#f4f4f5" stroke-width="1.5" stroke-linecap="round"/>
  
  <defs>
    <linearGradient id="goldGradient" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="neonGradient" x1="16" y1="32" x2="48" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
</svg>
